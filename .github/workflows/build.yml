name: Build IPTV Player APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'build-log.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for project ZIP
        id: zip
        run: |
          F=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$F" ]; then
            echo "::warning::Brak pliku .zip. Wgraj iptv_player.zip."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Znaleziono: $F"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$F" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.zip.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: steps.zip.outputs.found == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Unpack project
        if: steps.zip.outputs.found == 'true'
        run: |
          set -eo pipefail
          LOG="$GITHUB_WORKSPACE/build-log.txt"
          echo "=== BUILD $(date -u) ===" > "$LOG"
          mkdir -p /tmp/src
          unzip -q "${{ steps.zip.outputs.file }}" -d /tmp/src
          PROJ=$(dirname "$(find /tmp/src -name pubspec.yaml | head -n 1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "PROJ=$PROJ" | tee -a "$LOG"

      - name: Fix Dart source
        if: steps.zip.outputs.found == 'true'
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          set -eo pipefail
          LOG="$GITHUB_WORKSPACE/build-log.txt"
          echo "=== FIX DART ===" >> "$LOG"
          sed -i "s|^import 'package:media_kit/media_kit.dart';|import 'package:media_kit/media_kit.dart' show MediaKit;|" lib/main.dart
          grep -n "media_kit" lib/main.dart >> "$LOG"

      - name: Generate Android platform
        if: steps.zip.outputs.found == 'true'
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          set -eo pipefail
          LOG="$GITHUB_WORKSPACE/build-log.txt"
          {
            echo "=== FLUTTER CREATE ==="
            rm -rf android
            flutter create --platforms=android --org com.damian --project-name iptv_player /tmp/tpl > /dev/null
            cp -r /tmp/tpl/android ./android
            python3 tools/patch_android.py
          } 2>&1 | tee -a "$LOG"

      - name: Patch Gradle
        if: steps.zip.outputs.found == 'true'
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          set -eo pipefail
          LOG="$GITHUB_WORKSPACE/build-log.txt"
          echo "=== PATCH GRADLE ===" >> "$LOG"
          cat > /tmp/prefix.gradle << 'GRADLE_EOF'
          subprojects { sp ->
              def applySdk = {
                  if (sp.hasProperty("android")) {
                      try {
                          sp.android.compileSdk = 34
                      } catch (Throwable t1) {
                          try { sp.android.compileSdkVersion(34) } catch (Throwable t2) { }
                      }
                      try {
                          if (sp.android.namespace == null) {
                              def ns = sp.group.toString()
                              if (!ns.contains(".")) {
                                  ns = "flutter.plugin." + ns.replaceAll("[^A-Za-z0-9_]", "_")
                              }
                              sp.android.namespace = ns
                          }
                      } catch (Throwable t3) { }
                  }
              }
              if (sp.state.executed) {
                  applySdk()
              } else {
                  sp.afterEvaluate { applySdk() }
              }
          }

          GRADLE_EOF
          cat /tmp/prefix.gradle android/build.gradle > /tmp/root.gradle
          mv /tmp/root.gradle android/build.gradle
          sed -i 's/^\( *\)compileSdk\(Version\)\? *=\? *.*$/\1compileSdk 34/' android/app/build.gradle
          sed -i 's/^\( *\)targetSdk\(Version\)\? *=\? *.*$/\1targetSdk 34/' android/app/build.gradle
          printf '\norg.gradle.jvmargs=-Xmx4096m\nandroid.suppressUnsupportedCompileSdk=34\n' >> android/gradle.properties
          {
            echo "--- android/build.gradle (poczatek) ---"
            head -30 android/build.gradle
            echo "--- android/app/build.gradle ---"
            cat android/app/build.gradle
          } >> "$LOG"

      - name: Build APK
        if: steps.zip.outputs.found == 'true'
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build-log.txt"
          {
            echo "=== PUB GET ==="
            flutter pub get > /dev/null
            echo "=== ANALYZE ==="
            flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos || true
            echo "=== BUILD RELEASE ==="
            if flutter build apk --release --no-shrink; then
              cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/iptv-player.apk"
              echo "RELEASE OK"
            else
              echo "=== RELEASE PADL, PROBUJE DEBUG ==="
              flutter build apk --debug
              cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/iptv-player.apk"
              echo "DEBUG OK"
            fi
          } 2>&1 | tee -a "$LOG"

      - name: Save log into repository
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -f build-log.txt ]; then echo "brak logu" > build-log.txt; fi
          tail -c 120000 build-log.txt > log-tail.tmp
          mv log-tail.tmp build-log.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build-log.txt
          git commit -m "log budowy [skip ci]" || echo "nic do commitowania"
          git pull --rebase --autostash || true
          git push || echo "push nieudany"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: iptv-player.apk
          if-no-files-found: ignore

      - name: Publish release
        if: hashFiles('iptv-player.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "IPTV Player - build ${{ github.run_number }}"
          body: "Gotowy plik APK do instalacji na Android / Android TV / Fire Stick."
          files: iptv-player.apk

      - name: Report result
        if: always()
        run: |
          if [ -f iptv-player.apk ]; then
            ls -lh iptv-player.apk
            echo "APK GOTOWE"
          else
            echo "::error::Budowa nieudana - log zapisany w pliku build-log.txt w repozytorium."
            exit 1
          fi
