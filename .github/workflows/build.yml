name: Build IPTV Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for project ZIP
        id: zip
        run: |
          F=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$F" ]; then
            echo "::warning::Brak pliku .zip. Wgraj iptv_player.zip."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Znaleziono: $F"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$F" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        if: steps.zip.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: steps.zip.outputs.found == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Unpack, patch and build APK
        if: steps.zip.outputs.found == 'true'
        run: |
          set -e
          mkdir -p /tmp/src
          unzip -q "${{ steps.zip.outputs.file }}" -d /tmp/src
          PROJ=$(dirname "$(find /tmp/src -name pubspec.yaml | head -n 1)")
          echo "Projekt: $PROJ"
          cd "$PROJ"
          rm -rf android
          flutter create --platforms=android --org com.damian --project-name iptv_player /tmp/tpl
          cp -r /tmp/tpl/android ./android
          python3 tools/patch_android.py
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/iptv-player.apk"

      - name: Upload artifact
        if: steps.zip.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: iptv-player.apk

      - name: Publish release
        if: steps.zip.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "IPTV Player - build ${{ github.run_number }}"
          body: "Gotowy plik APK do instalacji na Android / Android TV / Fire Stick."
          files: iptv-player.apk
